# Generated by haproxy-advanced from /etc/config/haproxy-advanced.
# Do not edit: the service rewrites this file.

global
    log /dev/log local0 info
    log-tag haproxy-advanced
    maxconn 2000
    user nobody
    group nogroup
    stats socket /var/run/haproxy-advanced/admin.sock mode 600 level admin
    stats timeout 30s
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults ha_http
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option httplog
    timeout http-request 10s
    timeout http-keep-alive 10s
    option dontlog-normal
    option log-separate-errors

defaults ha_tcp
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option tcplog
    option dontlog-normal

frontend fe_pub from ha_http
    bind 203.0.113.10:443 ssl crt /c/app.pem alpn h2,http/1.1
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_app req.hdr(host),host_only,lower -m str app.example.com
    acl ha_login_admins http_auth(ul_admins)
    acl ha_login_staff http_auth(ul_staff)
    http-request deny deny_status 404 if !host_app
    # service app
    http-request deny deny_status 400 if host_app ha_ambiguous_path
    http-request del-header X-Forwarded-For if host_app
    http-request del-header X-Forwarded-Host if host_app
    http-request del-header X-Forwarded-Proto if host_app
    http-request del-header X-Forwarded-Port if host_app
    http-request del-header X-Real-IP if host_app
    http-request del-header Forwarded if host_app
    http-request set-header X-Forwarded-For %[src] if host_app
    http-request set-header X-Forwarded-Proto https if host_app
    http-request set-header X-Forwarded-Port 443 if host_app
    http-request deny deny_status 404 if host_app { src 10.0.0.0/8 } { path,url_dec,lower,regsub(;[^/]*,,g) -m beg /api/ }
    http-request allow if host_app { path,url_dec -m beg /Public/ } { method GET HEAD }
    http-request set-var(txn.ha_auth_admins) bool(true) if host_app { path,url_dec,lower,regsub(;[^/]*,,g) -m beg /admin/ } { req.hdr(authorization) -m found } ha_login_admins
    http-request auth realm "Restricted" if host_app { path,url_dec,lower,regsub(;[^/]*,,g) -m beg /admin/ } !{ var(txn.ha_auth_admins) -m bool }
    http-request deny deny_status 403 if host_app
    http-request set-var(txn.ha_auth_staff) bool(true) if host_app { req.hdr(authorization) -m found } ha_login_staff
    http-request auth realm "Staff" if host_app !{ var(txn.ha_auth_staff) -m bool }
    use_backend be_app if host_app

backend be_app from ha_http
    balance roundrobin
    server a 192.168.1.40:80

userlist ul_admins
    user root.admin password $2y$10$abcdefghijklmnopqrstuuABCDEFGHIJKLMNOPQRSTUVWXYZ01234

userlist ul_staff
    user bob password $6$saltsaltsaltsalt$aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
