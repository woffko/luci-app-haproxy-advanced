# Generated by haproxy-advanced from /etc/config/haproxy-advanced.
# Do not edit: the service rewrites this file.

global
    log /dev/log local0 info
    log-tag haproxy-advanced
    maxconn 2000
    user nobody
    group nogroup
    stats socket /var/run/haproxy-advanced/admin.sock mode 600 level admin
    stats timeout 30s
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults ha_http
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option httplog
    timeout http-request 10s
    timeout http-keep-alive 10s
    option dontlog-normal
    option log-separate-errors

defaults ha_tcp
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option tcplog
    option dontlog-normal

frontend fe_edge from ha_tcp
    bind 203.0.113.10:443
    bind ipv6@2001:db8::10:443
    tcp-request inspect-delay 5s
    acl sni_vault req.ssl_sni,lower -m str vault.example.com
    tcp-request content reject if sni_vault !{ src 198.51.100.0/24 2001:db8:100::/48 }
    tcp-request content track-sc0 src table st_vault if sni_vault
    tcp-request content reject if sni_vault { sc0_conn_rate gt 20 }
    tcp-request content accept if { req.ssl_hello_type 1 }
    tcp-request content reject
    use_backend be_vault if sni_vault
    default_backend be_edge_loop

backend be_edge_loop from ha_tcp
    timeout tunnel 1h
    server loop abns@haproxy-advanced-edge send-proxy-v2

frontend fe_edge_https from ha_http
    bind abns@haproxy-advanced-edge accept-proxy ssl crt /etc/haproxy/certs/www.pem alpn h2,http/1.1
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_web req.hdr(host),host_only,lower -m str www.example.com
    http-request deny deny_status 404 if !host_web
    # service web
    http-request deny deny_status 400 if host_web ha_ambiguous_path
    http-request del-header X-Forwarded-For if host_web
    http-request del-header X-Forwarded-Host if host_web
    http-request del-header X-Forwarded-Proto if host_web
    http-request del-header X-Forwarded-Port if host_web
    http-request del-header X-Real-IP if host_web
    http-request del-header Forwarded if host_web
    http-request set-header X-Forwarded-For %[src] if host_web
    http-request set-header X-Forwarded-Proto https if host_web
    http-request set-header X-Forwarded-Port 443 if host_web
    use_backend be_web if host_web

backend be_vault from ha_tcp
    balance roundrobin
    default-server inter 10s
    timeout tunnel 2h
    server v1 192.168.1.20:8443 check

backend be_web from ha_http
    balance roundrobin
    server w1 ipv6@fd00::20:8080

backend st_vault from ha_tcp
    stick-table type ipv6 size 100k expire 10m store conn_rate(10s)
