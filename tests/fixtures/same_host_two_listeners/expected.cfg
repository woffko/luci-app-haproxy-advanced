# Generated by haproxy-advanced from /etc/config/haproxy-advanced.
# Do not edit: the service rewrites this file.

global
    log /dev/log local0 info
    log-tag haproxy-advanced
    maxconn 2000
    user nobody
    group nogroup
    stats socket /var/run/haproxy-advanced/admin.sock mode 600 level admin
    stats timeout 30s
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults ha_http
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option httplog
    timeout http-request 10s
    timeout http-keep-alive 10s
    option dontlog-normal
    option log-separate-errors

defaults ha_tcp
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option tcplog
    option dontlog-normal

frontend fe_lan from ha_http
    bind 192.168.1.1:443 ssl crt /c/a.pem alpn h2,http/1.1
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_lanside req.hdr(host),host_only,lower -m str nas.example.com
    http-request deny deny_status 404 if !host_lanside
    # service lanside
    http-request deny deny_status 400 if host_lanside ha_ambiguous_path
    http-request del-header X-Forwarded-For if host_lanside
    http-request del-header X-Forwarded-Host if host_lanside
    http-request del-header X-Forwarded-Proto if host_lanside
    http-request del-header X-Forwarded-Port if host_lanside
    http-request del-header X-Real-IP if host_lanside
    http-request del-header Forwarded if host_lanside
    http-request set-header X-Forwarded-For %[src] if host_lanside
    http-request set-header X-Forwarded-Proto https if host_lanside
    http-request set-header X-Forwarded-Port 443 if host_lanside
    use_backend be_b if host_lanside

frontend fe_wan from ha_http
    bind 203.0.113.10:443 ssl crt /c/a.pem alpn h2,http/1.1
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_wanside req.hdr(host),host_only,lower -m str nas.example.com
    acl blocked_wanside path,url_dec,lower,regsub(;[^/]*,,g) -m beg /admin/
    http-request deny deny_status 404 if !host_wanside
    # service wanside
    http-request deny deny_status 400 if host_wanside ha_ambiguous_path
    http-request del-header X-Forwarded-For if host_wanside
    http-request del-header X-Forwarded-Host if host_wanside
    http-request del-header X-Forwarded-Proto if host_wanside
    http-request del-header X-Forwarded-Port if host_wanside
    http-request del-header X-Real-IP if host_wanside
    http-request del-header Forwarded if host_wanside
    http-request set-header X-Forwarded-For %[src] if host_wanside
    http-request set-header X-Forwarded-Proto https if host_wanside
    http-request set-header X-Forwarded-Port 443 if host_wanside
    http-request deny deny_status 403 if host_wanside blocked_wanside
    use_backend be_b if host_wanside

backend be_b from ha_http
    balance roundrobin
    server s 192.168.1.2:80
