# Generated by haproxy-advanced from /etc/config/haproxy-advanced.
# Do not edit: the service rewrites this file.

global
    log /dev/log local0 info
    log-tag haproxy-advanced
    maxconn 2000
    user nobody
    group nogroup
    stats socket /var/run/haproxy-advanced/admin.sock mode 600 level admin
    stats timeout 30s
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults ha_http
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option httplog
    timeout http-request 10s
    timeout http-keep-alive 10s
    option dontlog-normal
    option log-separate-errors

defaults ha_tcp
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option tcplog
    option dontlog-normal

frontend fe_public from ha_http
    bind 203.0.113.10:443 transparent ssl crt /etc/haproxy/certs/nas.pem crt /etc/haproxy/certs/ha.pem alpn h2,http/1.1
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_nas req.hdr(host),host_only,lower -m str nas.example.com
    acl trusted_nas src 192.168.20.0/24
    acl blocked_nas path,url_dec,lower,regsub(;[^/]*,,g) -m beg /cgi-bin/
    acl internal_nas path,url_dec,lower,regsub(;[^/]*,,g) -m beg /admin/
    acl public_nas path,url_dec -m beg /share/
    acl host_ha req.hdr(host),host_only,lower -m str ha.example.com
    acl ha_login_family http_auth(ul_family)
    http-request deny deny_status 404 if !host_nas !host_ha
    http-request set-var(txn.ha_svc) str(nas) if host_nas
    # service nas
    http-request deny deny_status 400 if host_nas ha_ambiguous_path
    http-request del-header X-Forwarded-For if host_nas
    http-request del-header X-Forwarded-Host if host_nas
    http-request del-header X-Forwarded-Proto if host_nas
    http-request del-header X-Forwarded-Port if host_nas
    http-request del-header X-Real-IP if host_nas
    http-request del-header Forwarded if host_nas
    http-request set-header X-Forwarded-For %[src] if host_nas
    http-request set-header X-Forwarded-Proto https if host_nas
    http-request set-header X-Forwarded-Port 443 if host_nas
    http-request track-sc0 src table st_nas if host_nas
    http-request deny deny_status 429 if host_nas { sc_http_req_rate(0) gt 300 }
    http-request deny deny_status 429 if host_nas { sc_gpc_rate(0,0) gt 10 }
    http-request deny deny_status 403 if host_nas blocked_nas
    http-request allow if host_nas trusted_nas
    http-request deny deny_status 403 if host_nas internal_nas
    http-request allow if host_nas public_nas
    http-request set-var(txn.ha_auth_family) bool(true) if host_nas { req.hdr(authorization) -m found } ha_login_family
    http-request sc-inc-gpc(0,0) if host_nas { req.hdr(authorization) -m found } !{ var(txn.ha_auth_family) -m bool }
    http-request auth realm "Family NAS" if host_nas !{ var(txn.ha_auth_family) -m bool }
    # service ha
    http-request add-header X-Forwarded-For %[src] if host_ha
    http-request set-header X-Forwarded-Proto https if host_ha
    http-request set-header X-Forwarded-Port 443 if host_ha
    http-response set-header Strict-Transport-Security "max-age=31536000" if { var(txn.ha_svc) -m str nas }
    use_backend be_nas if host_nas
    use_backend be_ha if host_ha

frontend fe_public_redirect from ha_http
    bind 203.0.113.10:80 transparent
    acl ha_acme_challenge path_beg /.well-known/acme-challenge/
    acl host_nas req.hdr(host),host_only,lower -m str nas.example.com
    acl host_ha req.hdr(host),host_only,lower -m str ha.example.com
    http-request deny deny_status 404 if !ha_acme_challenge !host_nas !host_ha
    http-request redirect location https://%[req.hdr(host),host_only]%[pathq] code 308 if !ha_acme_challenge
    use_backend be_ha_acme if ha_acme_challenge

backend be_nas from ha_http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /status ver HTTP/1.1 hdr Host nas.example.com
    http-check expect rstatus '^(2[0-9][0-9]|3[0-9][0-9])$'
    default-server inter 10s
    server nas1 192.168.10.2:443 ssl verify none check

backend be_ha from ha_http
    balance roundrobin
    timeout tunnel 1h
    server ha1 192.168.10.3:8123

backend be_ha_acme from ha_http
    server acme 127.0.0.1:18402

backend st_nas from ha_tcp
    stick-table type ipv6 size 100k expire 10m store http_req_rate(10s),gpc(1),gpc_rate(1,1m)

userlist ul_family
    user alice password $6$saltsalt$abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ./abcdefghijklmnopqrstuvwxyz0123
