# Generated by haproxy-advanced from /etc/config/haproxy-advanced.
# Do not edit: the service rewrites this file.

global
    log /dev/log local0 notice
    log-tag haproxy-advanced
    maxconn 50000
    user nobody
    group nogroup
    stats socket /var/run/haproxy-advanced/admin.sock mode 600 level admin
    stats timeout 30s
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2
    nbthread 2
    tune.bufsize 32768

defaults ha_http
    mode http
    log global
    option dontlognull
    timeout connect 3s
    timeout client 2m
    timeout server 90s
    default-server init-addr last,libc,none
    option httplog
    timeout http-request 5s
    timeout http-keep-alive 2s

defaults ha_tcp
    mode tcp
    log global
    option dontlognull
    timeout connect 3s
    timeout client 2m
    timeout server 90s
    default-server init-addr last,libc,none
    option tcplog

frontend fe_pub from ha_http
    bind 0.0.0.0:443 ssl crt /c/default.pem crt /c/a.pem crt /c/b.pem alpn http/1.1
    timeout client 30s
    option http-buffer-request
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_a req.hdr(host),host_only,lower -m str a.example.com
    acl host_b req.hdr(host),host_only,lower -m str b.example.com
    http-request deny deny_status 404 if !host_a !host_b
    http-request set-var(txn.ha_svc) str(b) if host_b
    # service a
    http-request add-header X-Forwarded-For %[src] if host_a
    http-request set-header X-Forwarded-Proto https if host_a
    http-request set-header X-Forwarded-Port 443 if host_a
    http-request set-header X-Proxy "haproxy-advanced" if host_a
    http-request set-header X-Empty "" if host_a
    http-request set-timeout client 10m if host_a
    http-response del-header Server if host_a
    http-after-response set-header X-Frame-Options SAMEORIGIN if host_a
    # service b
    http-request deny deny_status 400 if host_b ha_ambiguous_path
    http-request del-header X-Forwarded-For if host_b
    http-request del-header X-Forwarded-Host if host_b
    http-request del-header X-Forwarded-Proto if host_b
    http-request del-header X-Forwarded-Port if host_b
    http-request del-header X-Real-IP if host_b
    http-request del-header Forwarded if host_b
    http-response set-header Strict-Transport-Security "max-age=600; includeSubDomains" if { var(txn.ha_svc) -m str b }
    use_backend be_b if host_a
    use_backend be_b if host_b

backend be_b from ha_http
    balance roundrobin
    server s 192.168.1.2:80
