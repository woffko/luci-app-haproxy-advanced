# Generated by haproxy-advanced from /etc/config/haproxy-advanced.
# Do not edit: the service rewrites this file.

global
    log /dev/log local0 info
    log-tag haproxy-advanced
    maxconn 2000
    user nobody
    group nogroup
    stats socket /var/run/haproxy-advanced/admin.sock mode 600 level admin
    stats timeout 30s
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults ha_http
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option httplog
    timeout http-request 10s
    timeout http-keep-alive 10s
    option dontlog-normal
    option log-separate-errors

defaults ha_tcp
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option tcplog
    option dontlog-normal

frontend fe_pub from ha_http
    bind 0.0.0.0:443 ssl crt /c/a.pem alpn h2,http/1.1
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_a req.hdr(host),host_only,lower -m str a.example.com
    http-request deny deny_status 404 if !host_a
    # service a
    use_backend be_pool if host_a

backend be_pool from ha_http
    balance leastconn
    option httpchk
    http-check send meth HEAD uri /health?full=1 ver HTTP/1.1 hdr Host health.example.com
    http-check expect rstatus '^(200|3[0-9][0-9])$'
    default-server inter 5s
    timeout connect 2s
    timeout server 30s
    timeout tunnel 1h
    server tls-ca 192.168.1.10:443 ssl verify required ca-file @system-ca sni req.hdr(host),host_only verifyhost app.internal check weight 10
    server tls.named backend.lan:443 ssl verify none ca-file /etc/ssl/certs/lan-ca.crt sni str(fixed.example.com) check maxconn 50
    server v6 ipv6@fd00::10:80 check weight 0 backup send-proxy-v2
    option redispatch
    retries 2
