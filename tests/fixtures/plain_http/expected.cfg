# Generated by haproxy-advanced from /etc/config/haproxy-advanced.
# Do not edit: the service rewrites this file.

global
    log /dev/log local0 info
    log-tag haproxy-advanced
    maxconn 2000
    user nobody
    group nogroup
    stats socket /var/run/haproxy-advanced/admin.sock mode 600 level admin
    stats timeout 30s
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults ha_http
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option httplog
    timeout http-request 10s
    timeout http-keep-alive 10s
    option dontlog-normal
    option log-separate-errors

defaults ha_tcp
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option tcplog
    option dontlog-normal

frontend fe_lanhttp from ha_http
    bind 192.168.1.1:8080
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_wiki req.hdr(host),host_only,lower -m str wiki.lan
    http-request deny deny_status 404 if !host_wiki
    # service wiki
    http-request deny deny_status 400 if host_wiki ha_ambiguous_path
    http-request del-header X-Forwarded-For if host_wiki
    http-request del-header X-Forwarded-Host if host_wiki
    http-request del-header X-Forwarded-Proto if host_wiki
    http-request del-header X-Forwarded-Port if host_wiki
    http-request del-header X-Real-IP if host_wiki
    http-request del-header Forwarded if host_wiki
    http-request set-header X-Forwarded-For %[src] if host_wiki
    http-request set-header X-Forwarded-Proto http if host_wiki
    http-request set-header X-Forwarded-Port 8080 if host_wiki
    use_backend be_wiki if host_wiki

backend be_wiki from ha_http
    balance roundrobin
    server w 192.168.1.30:80
