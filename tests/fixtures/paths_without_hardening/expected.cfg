# Generated by haproxy-advanced from /etc/config/haproxy-advanced.
# Do not edit: the service rewrites this file.

global
    log /dev/log local0 info
    log-tag haproxy-advanced
    maxconn 2000
    user nobody
    group nogroup
    stats socket /var/run/haproxy-advanced/admin.sock mode 600 level admin
    stats timeout 30s
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults ha_http
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option httplog
    timeout http-request 10s
    timeout http-keep-alive 10s
    option dontlog-normal
    option log-separate-errors

defaults ha_tcp
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option tcplog
    option dontlog-normal

frontend fe_pub from ha_http
    bind 0.0.0.0:443 ssl crt /c/a.pem alpn h2,http/1.1
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_files req.hdr(host),host_only,lower -m str files.example.com
    acl internal_files path,url_dec,lower,regsub(;[^/]*,,g) -m beg /admin/
    acl public_files path,url_dec -m beg /share/
    acl host_plain req.hdr(host),host_only,lower -m str plain.example.com
    http-request deny deny_status 404 if !host_files !host_plain
    # service files
    http-request deny deny_status 400 if host_files ha_ambiguous_path
    http-request add-header X-Forwarded-For %[src] if host_files
    http-request set-header X-Forwarded-Proto https if host_files
    http-request set-header X-Forwarded-Port 443 if host_files
    http-request deny deny_status 403 if host_files internal_files
    http-request allow if host_files public_files
    # service plain
    http-request add-header X-Forwarded-For %[src] if host_plain
    http-request set-header X-Forwarded-Proto https if host_plain
    http-request set-header X-Forwarded-Port 443 if host_plain
    use_backend be_b if host_files
    use_backend be_b if host_plain

backend be_b from ha_http
    balance roundrobin
    server s 192.168.1.2:80
