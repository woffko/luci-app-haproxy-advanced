# Generated by haproxy-advanced from /etc/config/haproxy-advanced.
# Do not edit: the service rewrites this file.

global
    log /dev/log local0 info
    log-tag haproxy-advanced
    maxconn 2000
    user nobody
    group nogroup
    stats socket /var/run/haproxy-advanced/admin.sock mode 600 level admin
    stats timeout 30s
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults ha_http
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option httplog
    timeout http-request 10s
    timeout http-keep-alive 10s
    option dontlog-normal
    option log-separate-errors

defaults ha_tcp
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none
    option tcplog
    option dontlog-normal

frontend fe_multi from ha_http
    bind 203.0.113.10:443 ssl crt /c/a.pem alpn h2,http/1.1
    bind ipv6@2001:db8::10:443 ssl crt /c/a.pem alpn h2,http/1.1
    bind ipv6@2001:db8::99:443 ssl crt /c/a.pem alpn h2,http/1.1
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_a req.hdr(host),host_only,lower -m str a.example.com
    http-request deny deny_status 404 if !host_a
    # service a
    http-request deny deny_status 400 if host_a ha_ambiguous_path
    http-request del-header X-Forwarded-For if host_a
    http-request del-header X-Forwarded-Host if host_a
    http-request del-header X-Forwarded-Proto if host_a
    http-request del-header X-Forwarded-Port if host_a
    http-request del-header X-Real-IP if host_a
    http-request del-header Forwarded if host_a
    http-request set-header X-Forwarded-For %[src] if host_a
    http-request set-header X-Forwarded-Proto https if host_a
    http-request set-header X-Forwarded-Port 443 if host_a
    use_backend be_b if host_a

frontend fe_v6any from ha_http
    bind :::8443 v6only ssl crt /c/a.pem alpn h2,http/1.1
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_b req.hdr(host),host_only,lower -m str b.example.com
    http-request deny deny_status 404 if !host_b
    # service b
    http-request deny deny_status 400 if host_b ha_ambiguous_path
    http-request del-header X-Forwarded-For if host_b
    http-request del-header X-Forwarded-Host if host_b
    http-request del-header X-Forwarded-Proto if host_b
    http-request del-header X-Forwarded-Port if host_b
    http-request del-header X-Real-IP if host_b
    http-request del-header Forwarded if host_b
    http-request set-header X-Forwarded-For %[src] if host_b
    http-request set-header X-Forwarded-Proto https if host_b
    http-request set-header X-Forwarded-Port 8443 if host_b
    use_backend be_b if host_b

frontend fe_v4v6any from ha_http
    bind :::9443 v4v6 ssl crt /c/a.pem alpn h2,http/1.1
    acl ha_ambiguous_path path,url_dec -m reg '(^|/)\.\.?(/|$)|//|\\'
    acl ha_ambiguous_path path -m sub -i %00
    acl host_c req.hdr(host),host_only,lower -m str c.example.com
    http-request deny deny_status 404 if !host_c
    # service c
    http-request deny deny_status 400 if host_c ha_ambiguous_path
    http-request del-header X-Forwarded-For if host_c
    http-request del-header X-Forwarded-Host if host_c
    http-request del-header X-Forwarded-Proto if host_c
    http-request del-header X-Forwarded-Port if host_c
    http-request del-header X-Real-IP if host_c
    http-request del-header Forwarded if host_c
    http-request set-header X-Forwarded-For %[src] if host_c
    http-request set-header X-Forwarded-Proto https if host_c
    http-request set-header X-Forwarded-Port 9443 if host_c
    use_backend be_b if host_c

backend be_b from ha_http
    balance roundrobin
    server s 192.168.1.2:80
